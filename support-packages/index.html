<style>
/* ===== Base & tokens ===== */
:root{
  --accent:#f4c7b8;
  --accent-dark:#e6ad9a;
  --card:rgba(10,4,5,.55);
  --card-2:rgba(10,4,5,.6);
  --border:rgba(255,255,255,.10);
  --text:#ffffff;
  --muted:#c9c3c4;
  --radius:20px;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:'Almarai',sans-serif;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  background: radial-gradient(circle at 0% 0%, #0a0405, #3d0b12, #0a0405);
  background-repeat:no-repeat;
  min-height:100vh;
  color:var(--text);
  font-weight:400;
  line-height:1.9;
  overflow-x:hidden;
}
/* make sure form controls never fall back to a system font */
button,a,input,select,textarea{font-family:'Almarai',sans-serif;}
html[lang="en"] body{line-height:1.7;letter-spacing:0;}
html[lang="ar"] body{letter-spacing:0;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;border:0;background:none;color:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.container{width:100%;max-width:1120px;margin-inline:auto;padding-inline:20px;}

/* ===== Top bar / language switcher ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding-block:18px;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand img{height:44px;width:auto;}
.lang{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.04);padding:4px;}
.lang button{padding:6px 16px;border-radius:999px;font-size:.92rem;font-weight:700;color:var(--muted);min-height:36px;transition:.2s;}
.lang button[aria-pressed="true"]{background:var(--accent);color:#0a0405;}
.lang .sep{color:var(--muted);opacity:.5;padding-inline:2px;}

/* ===== Intro ===== */
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0 8px;}
.avatar{width:min(340px,82vw);aspect-ratio:1/.92;position:relative;}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 0;
  -webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 98%);
  mask-image:linear-gradient(to bottom,#000 60%,transparent 98%);}
.intro-body{display:flex;flex-direction:column;align-items:center;min-width:0;margin-top:-6px;}
.intro h1{font-size:clamp(1.6rem,3.4vw,2.1rem);font-weight:800;line-height:1.4;}
.role{color:#f4c7b8;font-weight:700;font-size:1.1rem;margin-block:2px 8px;}
.bio{color:var(--muted);max-width:56ch;font-size:1rem;}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:20px;}
.socials a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);
  background:rgba(255,255,255,.07);transition:.2s;}
.socials a:hover{background:var(--accent);border-color:var(--accent);color:#0a0405;transform:translateY(-2px);}
.socials svg{width:22px;height:22px;fill:currentColor;}
.socials img{width:24px;height:24px;object-fit:contain;transition:.2s;}
.socials a:hover img{filter:brightness(0);}

/* ===== Packages ===== */
.packages{padding-block:44px 24px;}
.section-head{text-align:center;margin-bottom:30px;}
.section-head h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;line-height:1.4;}
.section-head p{color:var(--muted);max-width:60ch;margin:8px auto 0;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch;}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .2s,transform .2s,box-shadow .2s;}
.card:hover{transform:translateY(-3px);border-color:rgba(244,199,184,.45);}
.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow);}
.badge{position:absolute;top:-13px;inset-inline-start:50%;transform:translateX(-50%);background:var(--accent);color:#0a0405;
  font-weight:800;font-size:.82rem;padding:3px 16px;border-radius:999px;white-space:nowrap;}
html[dir="rtl"] .badge{transform:translateX(50%);}
/* Upper panel: package name, price, description, buttons */
.card-top{display:flex;flex-direction:column;padding:30px 24px 22px;}
.pkg-metal{font-size:1.5rem;font-weight:800;line-height:1.3;}
.pkg-title{font-size:.92rem;font-weight:700;color:var(--accent);margin-top:2px;}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;color:var(--accent);margin-top:14px;}
.price .num{font-size:2.3rem;font-weight:800;line-height:1.2;direction:ltr;unicode-bidi:isolate;}
.price .unit{font-size:.95rem;font-weight:700;color:var(--accent);}
.pkg-desc{color:var(--muted);font-size:.95rem;line-height:1.75;margin-top:12px;min-height:7em;}
.card-top .actions{margin-top:auto;padding-top:18px;}
/* Lower features area: visual continuation of the card */
.card-feats{flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.03);border-top:1px solid var(--border);
  border-radius:0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);padding:20px 24px 26px;}
.features{list-style:none;display:grid;gap:12px;}
.features li{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:.97rem;line-height:1.7;}
.features svg{flex:0 0 auto;width:20px;height:20px;margin-top:4px;fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.actions{display:grid;gap:10px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;
  font-weight:700;font-size:1rem;text-align:center;transition:.2s;}
.btn-primary{background:var(--accent);color:#0a0405;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{border:1px solid var(--border);background:rgba(255,255,255,.04);color:#fff;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn svg{width:20px;height:20px;fill:currentColor;}

/* ===== Details ===== */
.details-wrap{padding-block:12px 40px;scroll-margin-top:92px;}
.details{position:relative;background:var(--card-2);border:1px solid var(--accent);border-radius:24px;padding:32px;box-shadow:var(--shadow);scroll-margin-top:92px;}
.details[hidden]{display:none;}
/* Header: two-level title (tier + service name) + price. The close button is
   pinned to the top corner of the panel, independent of title/price/height,
   so it can never wrap below the content on small screens. */
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:8px;padding-inline-end:56px;}
.d-metal{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800;line-height:1.35;}
.d-name{font-size:clamp(1.05rem,2vw,1.25rem);font-weight:800;color:var(--accent);line-height:1.55;margin-top:4px;}
.d-price{color:var(--accent);font-weight:800;font-size:1.3rem;margin-top:10px;}
.d-price bdi{direction:ltr;unicode-bidi:isolate;}
.close{position:absolute;top:28px;inset-inline-end:28px;width:44px;height:44px;border-radius:50%;
  background:#c4122f;color:#fff;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(196,18,47,.35);transition:background .2s,transform .15s,box-shadow .2s;}
.close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;}
.close:hover{background:#a30f27;transform:scale(1.07);box-shadow:0 6px 18px rgba(196,18,47,.45);}
.close:active{transform:scale(.92);background:#8f0d22;}
.close:focus-visible{outline:3px solid #fff;outline-offset:3px;}
.d-meta{display:flex;flex-wrap:wrap;gap:10px;margin-block:12px 22px;}
.chip{background:rgba(244,199,184,.10);border:1px solid rgba(244,199,184,.35);color:#fff1ec;padding:4px 14px;border-radius:999px;font-size:.9rem;font-weight:700;}
.d-sub{font-size:1.1rem;font-weight:700;margin-block:20px 12px;}
.inherit{background:rgba(255,255,255,.04);border:1px dashed var(--border);border-radius:14px;padding:12px 16px;color:var(--muted);margin-bottom:6px;}
.services{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.service{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:18px;}
.service h4{font-size:1.05rem;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start;}
.service h4 svg{flex:0 0 auto;width:20px;height:20px;margin-top:5px;fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.service p{color:var(--muted);font-size:.95rem;}
.service .gets{margin-top:8px;color:#fff1ec;font-size:.93rem;}
.service .gets b{color:var(--accent);font-weight:800;}
.scope{margin-top:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.scope > div{border-radius:16px;padding:18px;border:1px solid var(--border);}
.scope .in{background:rgba(244,199,184,.07);border-color:rgba(244,199,184,.35);}
.scope .out{background:rgba(200,60,80,.10);border-color:rgba(200,60,80,.45);}
.scope h4{font-weight:800;margin-bottom:6px;font-size:1.02rem;}
.scope p{color:var(--muted);font-size:.95rem;}
.d-cta{margin-top:26px;display:flex;justify-content:center;}
.d-cta .btn{min-width:min(100%,340px);}

/* ===== Footer ===== */
footer{border-top:1px solid var(--border);padding-block:26px;text-align:center;color:var(--muted);font-size:.95rem;}

/* ===== Responsive ===== */
@media (max-width:980px){
  .cards{grid-template-columns:1fr;max-width:520px;margin-inline:auto;}
  .services,.scope{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .container{padding-inline:16px;}
  .details{padding:22px 16px;}
  .close{top:16px;inset-inline-end:16px;}
  .brand img{height:38px;}
  .lang button{padding:6px 12px;}
  .card-top{padding:24px 20px 18px;}
  .card-feats{padding:18px 20px 22px;}
}
@media (max-width:360px){
  .pkg-desc{min-height:8.75em;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition:none !important;}
}


/* ===== Header ===== */
.site-header{position:sticky;top:0;z-index:50;background:rgba(10,4,5,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,3vw,32px);}
.brand{display:flex;align-items:center;gap:14px;min-width:0;}
.brand img{height:52px;width:auto;}

/* ===== Social icons: same size, always LinkedIn first from the left ===== */
.socials{direction:ltr;}
.socials a svg,.socials a img{width:24px;height:24px;flex:0 0 auto;}
.socials svg.o{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ===== Red for "choose package" buttons and the popular badge ===== */
.card .btn-primary,.badge{background:#c4122f;color:#fff;border:0;}
.card .btn-primary:hover{background:#a30f27;}

/* ===== Silver featured card: red border + badge (equal size, consistent panels) ===== */
@media (max-width:640px){
  .brand img{height:36px;}
    .brand{gap:10px;}
}

/* Behance logo is wider than tall */
.socials a img.wide{width:28px;height:auto;}
/* Subscribe button inside details: red like the other package buttons */
.d-cta .btn-primary{background:#c4122f;color:#fff;}
.d-cta .btn-primary:hover{background:#a30f27;}

/* ===== Mobile header: logo only + single language toggle ===== */
.lang-toggle{display:none;align-items:center;justify-content:center;min-height:44px;padding:6px 22px;border-radius:999px;
  border:1px solid rgba(255,255,255,.35);background:rgba(10,4,5,.6);color:#fff;font-weight:800;font-size:1rem;}
.lang-toggle:hover{border-color:#f4c7b8;color:#f4c7b8;}
@media (max-width:640px){
  .lang{display:none;}
  .lang-toggle{display:inline-flex;}
  .brand img{height:42px;}
}

/* Silver card: red border to stand out */
.card[data-pkg="silver"],.card[data-pkg="silver"].active{border-color:#c4122f;
  box-shadow:0 0 0 1px #c4122f,0 18px 60px rgba(196,18,47,.25),var(--shadow);}

/* chips may contain a small icon; details tagline */
.chip{display:inline-flex;align-items:center;gap:6px;}
.chip svg{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.d-tagline{color:var(--muted);font-size:.98rem;margin-top:2px;}

/* sub-lists inside a service block */
.service-list{margin:8px 0 0;padding-inline-start:0;list-style:none;display:grid;gap:5px;color:var(--muted);font-size:.93rem;}
.service-list li{display:flex;gap:8px;align-items:flex-start;line-height:1.6;}
.service-list li::before{content:'\2013';color:var(--accent);flex:0 0 auto;}

/* per-package important limitations */
.limits-list{list-style:none;display:grid;gap:10px;background:rgba(200,60,80,.10);border:1px solid rgba(200,60,80,.45);border-radius:16px;padding:18px 20px;margin-top:4px;}
.limits-list li{display:flex;gap:10px;align-items:flex-start;color:#ffd9de;font-size:.95rem;line-height:1.7;}
.limits-list svg{flex:0 0 auto;width:18px;height:18px;margin-top:5px;fill:none;stroke:#ef8a99;stroke-width:2.4;stroke-linecap:round;}

/* ===== Policy sections: care / response / exclusions / FAQ ===== */
.policies{padding-block:8px 44px;}
.policy{scroll-margin-top:92px;}
.policy + .policy{margin-top:44px;}
.policy .section-head{margin-bottom:20px;}
.policy .section-head h2{font-size:clamp(1.45rem,3vw,2rem);}
.policy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.limit-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 18px;text-align:center;box-shadow:var(--shadow);}
.limit-card.featured{border-color:#c4122f;box-shadow:0 0 0 1px #c4122f,0 18px 60px rgba(196,18,47,.18),var(--shadow);}
.limit-card h4{font-size:1.08rem;font-weight:800;margin-bottom:10px;}
/* ===== Your Monthly Store Care ===== */
.care-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.care-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.care-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(244,199,184,.10);border:1px solid rgba(244,199,184,.35);margin-bottom:14px;flex:0 0 auto;}
.care-icon svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.care-card h4{font-size:1.05rem;font-weight:800;margin-bottom:8px;}
.care-card p{color:var(--muted);font-size:.93rem;line-height:1.8;}
.resp-time{font-size:1.05rem;font-weight:800;color:var(--accent);line-height:1.5;}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(244,199,184,.07);border:1px solid rgba(244,199,184,.35);border-radius:16px;padding:14px 18px;color:#fff1ec;font-size:.95rem;line-height:1.8;margin-top:16px;}
.note svg{flex:0 0 auto;width:17px;height:17px;margin-top:5px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.note.warn{background:rgba(200,60,80,.10);border-color:rgba(200,60,80,.45);color:#ffd9de;}
.excl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.excl-item{display:flex;gap:9px;align-items:flex-start;background:rgba(200,60,80,.08);border:1px solid rgba(200,60,80,.35);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:.92rem;line-height:1.65;}
.excl-item svg{flex:0 0 auto;width:16px;height:16px;margin-top:4px;fill:none;stroke:#ef8a99;stroke-width:2.4;stroke-linecap:round;}
.faq{display:grid;gap:10px;max-width:860px;margin-inline:auto;}
.faq details{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.faq summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;font-weight:700;font-size:.98rem;}
.faq summary::-webkit-details-marker{display:none;}
.faq summary::after{content:'+';flex:0 0 auto;font-weight:800;font-size:1.2rem;color:var(--accent);line-height:1;}
.faq details[open] summary::after{content:'\2212';}
.faq summary:hover{color:var(--accent);}
.faq .a{padding:0 18px 15px;color:var(--muted);font-size:.94rem;line-height:1.8;}

@media (max-width:980px){
  .policy-grid{grid-template-columns:1fr;max-width:520px;margin-inline:auto;}
  .care-grid{grid-template-columns:1fr 1fr;}
  .excl-grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:640px){
  .excl-grid{grid-template-columns:1fr;}
  .care-grid{grid-template-columns:1fr;}
  .limits-list{padding:14px 16px;}
}

</style>
</head>

          {t:'Advanced Product Page Optimization', d:'Review and improve product page structure, information hierarchy, product presentation, and purchase-related elements.', g:'Product pages built to make the buying decision easier.'},
          {t:'Homepage & Collection Experience Optimization', d:'Improve the organization, presentation, and usability of important homepage and collection sections.', g:'A better-organized store that is easier to browse.'},
          {t:'Campaign & Promotional Store Optimization', d:'Review promotional presentation across relevant store pages and improve existing promotional sections, product bundles, and seasonal offer visibility.', g:'Campaigns and offers presented consistently across your store.'},
          {t:'Customer Journey & UX Review', d:'Review important steps in the shopping journey and identify friction points that may make browsing or purchasing more difficult.', g:'An easier, clearer path to purchase for your customers.'},
          {t:'Conversion-Focused Recommendations', d:'Practical recommendations based on available store information and observed user experience issues. Conversion-focused recommendations do not guarantee conversion-rate or sales improvements.', g:'Practical, actionable recommendations for improving the shopping experience.'},
          {t:'Detailed Monthly Improvement Report', d:'A detailed monthly report summarizing completed work, identified issues, improvement recommendations, and suggested priorities for the next month.', g:'A full picture of your store’s condition and a plan for what comes next.'},
          {t:'Highest Support Priority', d:'Eligible requests receive the highest priority among the three packages, with an initial response target of 4 business hours.', g:'Your requests come first, with the fastest initial response.'}
        ],
        limits:[
          'Advanced Store Growth Partnership provides a deeper monthly partnership: broader store reviews, a monthly improvement roadmap agreed at the start of each month, and improvements across multiple store areas.',
          'The monthly roadmap defines the work to be implemented based on store priorities, technical feasibility, and the subscription scope — it is not an open-ended commitment to unlimited modifications.',
          'It does not include unlimited development, complete redesigns, or unlimited requests; new custom landing pages built from scratch are quoted separately after technical assessment and approval.',
          'Any work outside the agreed roadmap or the package scope is assessed and quoted separately before it starts.',
          'Conversion-focused recommendations do not guarantee sales or conversion-rate improvements.',
          'Highest support priority does not mean unlimited availability or guaranteed immediate resolution.'
        ]
      }
    }
  };

  var ORDER = ['bronze','silver','gold'];

  /* Scope text (same for all packages) */
  var SCOPE = {
    ar: {
      inText:'الخدمات والتحسينات المذكورة صراحة في الباقة المختارة، بالإضافة إلى إصلاح الأعطال والمشاكل الفنية المتعلقة بالمتجر الحالي.',
      outText:'تطوير ميزات أو وظائف جديدة بالكامل، أو إعادة تصميم كبرى، أو أي كود مخصص خارج نطاق الباقة. هذه ليست مشمولة بالاشتراك ولا تقدم كتطوير مجاني غير محدود، وأي عمل إضافي يتم الاتفاق عليه وتسعيره بشكل منفصل قبل البدء.'
    },
    en: {
      inText:'The services and improvements explicitly listed in the selected package, plus fixing technical issues and bugs related to your existing store.',
      outText:'Developing entirely new features or functionality, major redesigns, or custom coding outside the package scope. These are not included in the subscription and are not offered as unlimited free development. Any additional work is discussed and quoted separately before it starts.'
    }
  };

  var WA_MSG = {
    ar:{bronze:'أهلاً يا Adel، أنا مهتم بالاشتراك في باقة البرونزية لدعم متجر Shopify. حابب أعرف تفاصيل الاشتراك والخطوات التالية.', silver:'أهلاً يا Adel، أنا مهتم بالاشتراك في باقة الفضية لدعم متجر Shopify. حابب أعرف تفاصيل الاشتراك والخطوات التالية.', gold:'أهلاً يا Adel، أنا مهتم بالاشتراك في باقة الذهبية لدعم متجر Shopify. حابب أعرف تفاصيل الاشتراك والخطوات التالية.'},
    en:{bronze:'Hello Adel, I’m interested in subscribing to the Bronze Shopify support package. I’d like to know more about the subscription and next steps.', silver:'Hello Adel, I’m interested in subscribing to the Silver Shopify support package. I’d like to know more about the subscription and next steps.', gold:'Hello Adel, I’m interested in subscribing to the Gold Shopify support package. I’d like to know more about the subscription and next steps.'},
  };

  /* =====================================================
     STATE
     ===================================================== */
  var state = { lang:'en', selected:null };

  var $cards = document.getElementById('cards');
  var $details = document.getElementById('details');
  var $socials = document.getElementById('socials');

  function waLink(key){
    return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(WA_MSG[state.lang][key]);
  }

  /* ----- static texts ----- */
  function applyStaticText(){
    var t = UI[state.lang];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t.title;
    document.getElementById('metaDesc').setAttribute('content', t.meta);
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      el.textContent = t[el.getAttribute('data-i18n')];
    });
    document.getElementById('btnAr').setAttribute('aria-pressed', state.lang === 'ar');
    document.getElementById('btnEn').setAttribute('aria-pressed', state.lang === 'en');
    var tg = document.getElementById('langToggle');
    tg.textContent = state.lang === 'ar' ? 'English' : 'العربية';
    tg.setAttribute('aria-label', state.lang === 'ar' ? 'Switch to English' : 'التبديل إلى العربية');
  }

  /* ----- social icons (order: LinkedIn, Behance, Nzmly, WhatsApp, Email) ----- */
  function renderSocials(){
    var t = UI[state.lang].social;
    var list = [
      {k:'linkedin', href:LINKEDIN_URL, ext:true},
      {k:'behance',  href:'https://www.behance.net/adelatefemam/', ext:true},
      {k:'nzmly',    href:'https://adelatefemam.nzmly.com/', ext:true},
      {k:'whatsapp', i:'whatsappO', href:'https://wa.me/' + WHATSAPP_NUMBER, ext:true},
      {k:'email', i:'emailO', href:EMAIL ? 'mailto:' + EMAIL : '', ext:false}
    ];
    $socials.innerHTML = list.filter(function(s){ return s.href; }).map(function(s){
      return '<a href="' + s.href + '"' + (s.ext ? ' target="_blank" rel="noopener noreferrer"' : '') +
             ' aria-label="' + t[s.k] + '" title="' + t[s.k] + '">' + ICONS[s.i || s.k] + '</a>';
    }).join('');
  }

  /* ----- pricing cards ----- */
  function renderCards(){
    var t = UI[state.lang];
    $cards.innerHTML = ORDER.map(function(key){
      var p = PACKAGES[key], c = p[state.lang];
      return '<article class="card' + (state.selected === key ? ' active' : '') + '" data-pkg="' + key + '">' +
        (p.popular ? '<span class="badge">' + t.popular + '</span>' : '') +
        '<div class="card-top">' +
          '<h3 class="pkg-metal">' + c.metal + '</h3>' +
          '<p class="pkg-title">' + c.name + '</p>' +
          '<div class="price"><span class="num">' + p.price + '</span><span class="unit">' + t.currency + ' ' + (state.lang === 'ar' ? '/ ' : '') + t.perMonth + '</span></div>' +
          '<p class="pkg-desc">' + c.tagline + '</p>' +
          '<div class="actions">' +
            '<button type="button" class="btn btn-ghost" data-details="' + key + '">' + t.viewDetails + '</button>' +
            '<a class="btn btn-primary" href="' + waLink(key) + '" target="_blank" rel="noopener noreferrer">' + t.choose + '</a>' +
          '</div>' +
        '</div>' +
        '<div class="card-feats">' +
          '<ul class="features">' + c.card.map(function(f){ return '<li>' + CHECK + '<span>' + f + '</span></li>'; }).join('') + '</ul>' +
        '</div></article>';
    }).join('');
  }

  /* ----- details panel ----- */
  function renderDetails(){
    if (!state.selected){ $details.hidden = true; $details.innerHTML = ''; return; }
    var key = state.selected, p = PACKAGES[key], c = p[state.lang], t = UI[state.lang], sc = SCOPE[state.lang];
    var inherit = '';
    if (p.inherits){
      inherit = '<p class="inherit">' + t.inheritLead + '<b>' + PACKAGES[p.inherits][state.lang].name + '</b>' + t.inheritTail + '</p>';
    }
    var limitsHtml = (c.limits && c.limits.length) ?
      '<h4 class="d-sub">' + t.pkgLimits + '</h4><ul class="limits-list">' +
      c.limits.map(function(l){ return '<li>' + DASH + '<span>' + l + '</span></li>'; }).join('') + '</ul>' : '';
    $details.innerHTML =
      '<div class="d-head">' +
        '<div class="d-titles"><h3 class="d-metal">' + c.metal + '</h3>' +
        '<p class="d-name">' + c.name + '</p>' +
        '<div class="d-price"><bdi>' + p.price + '</bdi> ' + t.currency + ' ' + (state.lang === 'ar' ? '/ ' : '') + t.perMonth + '</div></div>' +
        '<button type="button" class="close" id="closeDetails" aria-label="' + t.close + '">' + CROSS + '</button>' +
      '</div>' +
      '<p class="d-tagline">' + c.tagline + '</p>' +
      '<div class="d-meta"><span class="chip">' + CLOCK + '<span>' + t.response + ': ' + c.response + '</span></span></div>' +
      '<h4 class="d-sub">' + t.included + '</h4>' + inherit +
      '<div class="services">' + c.items.map(function(i){
        return '<div class="service"><h4>' + CHECK + '<span>' + i.t + '</span></h4><p>' + i.d + '</p>' +
               (i.list ? '<ul class="service-list">' + i.list.map(function(li){ return '<li>' + li + '</li>'; }).join('') + '</ul>' : '') +
               '<p class="gets"><b>' + t.gets + '</b> ' + i.g + '</p></div>';
      }).join('') + '</div>' +
      limitsHtml +
      '<div class="scope">' +
        '<div class="in"><h4>' + t.scopeInTitle + '</h4><p>' + sc.inText + '</p></div>' +
        '<div class="out"><h4>' + t.scopeOutTitle + '</h4><p>' + sc.outText + '</p></div>' +
      '</div>' +
      '<div class="d-cta"><a class="btn btn-primary" href="' + waLink(key) + '" target="_blank" rel="noopener noreferrer">' + ICONS.whatsapp + '<span>' + t.subscribe + '</span></a></div>';
    $details.hidden = false;
  }

  /* ----- policy sections: monthly store care, response policy, exclusions, FAQ ----- */
  function renderPolicies(){
    var host = document.getElementById('policies');
    if (!host) return;
    var t = UI[state.lang];
    var respCards = ORDER.map(function(key){
      var p = PACKAGES[key], c = p[state.lang];
      return '<div class="limit-card' + (p.popular ? ' featured' : '') + '">' +
        '<h4>' + c.name + '</h4><div class="resp-time">' + c.respShort + '</div>' +
      '</div>';
    }).join('');
    var careCards = t.careItems.map(function(x, idx){
      return '<div class="care-card">' +
        '<div class="care-icon">' + CARE_ICONS[idx] + '</div>' +
        '<h4>' + x.t + '</h4><p>' + x.d + '</p>' +
      '</div>';
    }).join('');
    host.innerHTML =
      '<section class="policy" id="care">' +
        '<div class="section-head"><h2>' + t.careTitle + '</h2><p>' + t.careDesc + '</p></div>' +
        '<div class="care-grid">' + careCards + '</div>' +
      '</section>' +
      '<section class="policy" id="response-policy">' +
        '<div class="section-head"><h2>' + t.respTitle + '</h2><p>' + t.respDesc + '</p></div>' +
        '<div class="policy-grid">' + respCards + '</div>' +
        '<p class="note">' + t.respNote + '</p>' +
        '<p class="note">' + CLOCK + '<span>' + t.businessHours + '</span></p>' +
        '<p class="note">' + t.respSubmit + '</p>' +
      '</section>' +
      '<section class="policy" id="exclusions">' +
        '<div class="section-head"><h2>' + t.exclTitle + '</h2><p>' + t.exclDesc + '</p></div>' +
        '<div class="excl-grid">' + t.exclItems.map(function(x){ return '<div class="excl-item">' + CROSS + '<span>' + x + '</span></div>'; }).join('') + '</div>' +
        '<p class="note warn">' + t.exclRule + '</p>' +
      '</section>' +
      '<section class="policy" id="faq">' +
        '<div class="section-head"><h2>' + t.faqTitle + '</h2><p>' + t.faqDesc + '</p></div>' +
        '<div class="faq">' + t.faq.map(function(f){ return '<details><summary><span>' + f.q + '</span></summary><div class="a">' + f.a + '</div></details>'; }).join('') + '</div>' +
      '</section>';
  }

  function renderAll(){
    applyStaticText();
    renderSocials();
    renderCards();
    renderDetails();
    renderPolicies();
  }

  /* =====================================================
     EVENTS
     ===================================================== */
  // Language switcher (no reload; keeps selected package)
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){
      state.lang = b.getAttribute('data-lang');
      renderAll();
    });
  });

  // Mobile single toggle: switches to the other language
  document.getElementById('langToggle').addEventListener('click', function(){
    state.lang = state.lang === 'ar' ? 'en' : 'ar';
    renderAll();
  });

  // "View details" buttons (event delegation)
  $cards.addEventListener('click', function(e){
    var btn = e.target.closest('[data-details]');
    if (!btn) return;
    state.selected = btn.getAttribute('data-details');
    renderCards();
    renderDetails();
    $details.scrollIntoView({behavior:'smooth', block:'start'});
  });

  // Close details
  $details.addEventListener('click', function(e){
    if (e.target.closest('#closeDetails')){
      state.selected = null;
      renderCards();
      renderDetails();
      document.getElementById('packages').scrollIntoView({behavior:'smooth', block:'start'});
    }
  });

  renderAll();
})();
</script>
</body>
</html>
